toolbar.append(statusLabel,syncText,hubLink);
if(mode==='connected')toolbar.insertBefore(xpButton,hubLink);
document.body.replaceChildren(toolbar,iframe);
document.body.style.cssText='margin:0;padding:0;background:#071e2a;overflow:hidden';

if(mode==='connected'&&importDecision===null){
 const veil=document.createElement('section');veil.style.cssText='position:fixed;z-index:999999;inset:44px 0 0;background:#071e2a;color:white;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto;font:15px system-ui';
 const card=document.createElement('div');card.style.cssText='box-sizing:border-box;width:min(580px,100%);border:1px solid #5597aa;border-radius:16px;background:#102f46;padding:24px';
 const title=document.createElement('h2');title.textContent='Bienvenue dans Math’as Connect';
 const info=document.createElement('p');info.textContent='Recherche des anciens résultats de ce navigateur…';
 const note=document.createElement('p');note.style.cssText='font-size:13px;color:#c0dfed';note.textContent='Récupération unique par application. Les anciens résultats locaux restent intacts. Les records importés ne créent pas de parties récentes.';
 const actions=document.createElement('div');actions.style.cssText='display:flex;flex-wrap:wrap;gap:10px;margin-top:18px';
 const mk=label=>{const b=document.createElement('button');b.type='button';b.textContent=label;b.style.cssText='padding:12px 14px;border:1px solid #8dc5d5;background:#126b88;border-radius:9px;color:white;font:600 14px system-ui;cursor:pointer';return b};
 const imp=mk('Récupérer mes résultats et XP'),skip=mk('Commencer à zéro'),later=mk('Plus tard — retour au HUB');
 imp.disabled=true;later.onclick=()=>location.assign('https://mr-tat.github.io/Mathas-Connect/hub.html?class='+encodeURIComponent(classId));
 actions.append(imp,skip,later);card.append(title,info,note,actions);veil.append(card);document.body.append(veil);
 let old=null;const busy=v=>{for(const b of [imp,skip,later])b.disabled=v};
 async function choose(skipImport){
  if(!skipImport&&!old)return;
  if(!confirm(skipImport?'Commencer sans récupération pour ce jeu ? Ce choix sera définitif.':'Récupérer une seule fois les anciens records et leurs XP ?'))return;
  busy(true);info.textContent='Enregistrement sécurisé dans Connect…';
  try{
   const auth=(await cloud.auth.getSession()).data.session;
   if(!auth){info.textContent='Session expirée. Reviens au HUB pour te reconnecter.';return}
   const res=await fetch(URL+'/functions/v1/connect-results',{method:'POST',headers:{apikey:KEY,authorization:'Bearer '+auth.access_token,'content-type':'application/json'},body:JSON.stringify({action:skipImport?'legacy-import-skip':'legacy-import-once',classId,appKey:APP,expectedRevision:revision,expectedResetEpoch:resetEpoch,...(skipImport?{}:{legacy:old})})});
   const data=await res.json();
   if(!res.ok||!data.ok){
    info.textContent=data.error==='import_closed_progress_exists'?'Une progression existe déjà. Recharge pour la consulter.':'Enregistrement non confirmé ('+(data.error||res.status)+'). Tu peux réessayer ou revenir au HUB.';
    return;
   }
   info.textContent='Choix enregistré. Rechargement…';location.reload();
  }catch{info.textContent='Connexion interrompue. Recharge la page pour vérifier si le serveur a déjà terminé.'}
  finally{busy(false)}
 }
 skip.onclick=()=>choose(true);
 try{
  const {legacySnapshot,legacyForCloud}=await import('./legacy-import.js');
  const snap=legacySnapshot(k=>native.get.call(localStorage,k));
  if(snap.meaningful){old=legacyForCloud(snap);imp.disabled=false;imp.onclick=()=>choose(false);info.textContent='Anciens résultats trouvés ! Tu peux récupérer les acquis et les XP correspondants.'}
  else info.textContent='Aucun ancien score compatible ici. Tu peux commencer à zéro ou revenir au navigateur de tes anciens scores.';
 }catch{info.textContent='Lecture des anciens résultats impossible. Aucune donnée effacée.';skip.disabled=true}
}

showSync();if(mode==='connected')drain();
}
</script></body></html>
