  if(!cloud){alert('Connexion au compte indisponible. Aucun résultat modifié.');return}
  const imported=legacyForCloud(snap);
  try{
   for(let attempt=0;attempt<3;attempt++){
    const active=(await cloud.auth.getSession()).data.session;
    if(!active){alert('Session Connecté expirée. Reconnecte-toi depuis le HUB.');return}
    const headers={apikey:KEY,authorization:'Bearer '+active.access_token,'content-type':'application/json'};
    const response=await fetch(URL+'/functions/v1/connect-results',{method:'POST',headers,body:JSON.stringify({action:'legacy-import',classId,appKey:APP,expectedRevision:revision,expectedResetEpoch:resetEpoch,legacy:imported})});

     alert('Anciens records récupérés dans le compte Connecté ! Les sauvegardes originales sont conservées.');
     location.reload();return;
    }
    if(result.error==='stale_reset_epoch'){alert('Le compte a été remis à zéro sur un autre appareil. Actualise la page avant tout import.');return}
    if(result.error!=='revision_conflict'){alert('Import interrompu : '+(result.error||'erreur réseau')+'. Aucun ancien résultat supprimé.');return}
    const read=await fetch(URL+'/functions/v1/connect-results',{method:'POST',headers,body:JSON.stringify({action:'student-load',classId,appKey:APP})});
    const refreshed=await read.json();if(!read.ok||!refreshed.ok)break;
    revision=refreshed.revision;resetEpoch=refreshed.resetEpoch??0;
   }
   alert('Import non terminé à cause de mises à jour concurrentes. Réessaie plus tard.');
  }catch(err){alert('Connexion interrompue : aucun ancien résultat supprimé. Réessaie après reconnexion.')}
  return;
 }

 alert('Records et déblocages récupérés dans le mode Classique. Le jeu va se recharger.');location.reload()
}

async function drain(){

 try{
  let q=readQueue();
  let conflicts=0;
  while(q.length){
   const e=q[0],a=(await cloud.auth.getSession()).data.session;
   if(!a)break;

   let res,data;
   try{res=await fetch(URL+'/functions/v1/connect-results',{method:'POST',headers,body:JSON.stringify(e)});data=await res.json()}catch{break}
   if(res.ok&&data.ok){revision=data.revision;resetEpoch=data.resetEpoch??resetEpoch;q.shift();saveQueue(q);conflicts=0;continue}
   if(data.error==='stale_reset_epoch'){q.shift();saveQueue(q);break}
   if(data.error==='revision_conflict'&&conflicts++<2){
    const v=await fetch(URL+'/functions/v1/connect-results',{method:'POST',headers,body:JSON.stringify({action:'student-load',classId,appKey:APP})}).then(r=>r.json()).catch(()=>null);
    if(!v?.ok)break;revision=v.revision;resetEpoch=v.resetEpoch??0;continue;
   }
   console.warn('Partie non envoyée',data.error);break;
  }
 }finally{draining=false;showSync()}
}
