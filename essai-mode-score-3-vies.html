<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Math’as — essai « 3 vies » sur Addition simple</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;background:#091b2e;color:#f2f7ff;font:14px system-ui,-apple-system,Segoe UI,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 18px;background:#162e48;border-bottom:1px solid #477092}
header strong{font-size:15px}header small{color:#c1d5e8}a{color:#d4efff;font-weight:700}
#state{color:#ffd19b;max-width:600px;margin:16px auto}
iframe{display:block;width:100%;height:calc(100dvh - 64px);border:0;background:#0c2235}
@media(max-width:700px){header{padding:9px 10px;gap:5px;flex-wrap:wrap}header strong{font-size:13px}header small{font-size:11px}iframe{height:calc(100dvh - 84px)}}
</style>
</head>
<body>
<header>
<div><strong>🧪 Addition simple — essai « Défis de score »</strong><div><small>Moteur original · résultats, XP et trophées isolés de ton compte</small></div></div>
<a href="./">↩ Jeu habituel</a>
</header>
<div id="state" role="alert">Préparation du jeu de démonstration…</div>
<iframe id="game" title="Essai sur le véritable moteur Addition simple" sandbox="allow-scripts allow-same-origin allow-forms allow-modals"></iframe>
<script>
(async function(){
 'use strict';
 const status=document.getElementById('state');
 const frame=document.getElementById('game');
 function swap(text,from,to,label){
   const split=text.split(from);
   if(split.length!==2)throw Error('La version du moteur a changé : '+label);
   return split[0]+to+split[1];
 }
 try{
   const response=await fetch('./game-original.html',{cache:'no-store'});
   if(!response.ok)throw Error('Moteur Addition simple indisponible');
   let game=await response.text();
   if(game.length<100000||!game.includes('window.MathasAppConfig'))throw Error('Moteur incorrect');

   // Iframe indépendant : aucun accès ni écriture au localStorage de l'élève.
   // Cette couche est chargée AVANT le premier script du moteur natif.
   const isolatedCode=[
     '(function(){',
     ' const values=new Map();',
     ' Storage.prototype.getItem=function(key){return values.has(String(key))?values.get(String(key)):null};',
     ' Storage.prototype.setItem=function(key,value){values.set(String(key),String(value))};',
     ' Storage.prototype.removeItem=function(key){values.delete(String(key))};',
     ' Storage.prototype.clear=function(){values.clear()};',
     ' window.fetch=function(){return Promise.reject(new Error("Réseau désactivé dans cet essai"))};',
     ' window.__mathasThreeLivesDemo=true;',
     '})();'
   ].join('\n');
   const isolateTag='<scr'+'ipt>'+isolatedCode+'<'+'/script>';
   game=swap(game,'<head>','<head><base href="./">'+isolateTag,'isolation des données');

   const visualCss=[
     '<style id="three-lives-preview-style">',
     '#menuScreen .score-mode-options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:7px}',
     '#menuScreen .score-mode-options button{width:100%;min-width:0;min-height:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:1.04rem;font-weight:900;line-height:1.2;padding:8px}',
     '#menuScreen .score-mode-options small{font-size:.71rem;font-weight:750;opacity:.95}',
     '#menuScreen .score-mode-options #startThreeLives{background:linear-gradient(#288b80,#125c62);color:white;border:1px solid #83d8bc;border-radius:12px;box-shadow:0 3px 0 #103c43}',
     '#menuScreen .score-mode-options #startSudden{border:1px solid #f1b586;border-radius:12px}',
     '#threeLivesHud{grid-column:1/-1;display:flex;justify-content:center;align-items:center;gap:12px;padding:8px 10px;border:1px solid #477e83;border-radius:10px;background:#173b4a;min-height:62px}',
     '#threeLivesHud[hidden]{display:none!important}',
     '#threeLivesHud .demo-heart{display:block;position:relative;width:44px;height:44px;flex:none;filter:drop-shadow(0 2px 3px #0005)}',
     '#threeLivesHud .demo-heart svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}',
     '#threeLivesHud .demo-heart .whole{transition:opacity .18s ease}',
     '#threeLivesHud .demo-heart .broken{opacity:0;transition:opacity .25s ease}',
     '#threeLivesHud .demo-heart .left-half,#threeLivesHud .demo-heart .right-half{transition:transform .44s cubic-bezier(.15,.8,.2,1)}',
     '#threeLivesHud .demo-heart.breaking{animation:heartLoss .86s ease-in-out}',
     '#threeLivesHud .demo-heart.lost .whole{opacity:0}',
     '#threeLivesHud .demo-heart.lost .broken{opacity:1}',
     '#threeLivesHud .demo-heart.lost .left-half{transform:translate(-2px,2px) rotate(-7deg);transform-origin:24px 22px}',
     '#threeLivesHud .demo-heart.lost .right-half{transform:translate(2px,3px) rotate(7deg);transform-origin:24px 22px}',
     '@keyframes heartLoss{0%{transform:scale(1)}33%{transform:scale(1.47)}54%{transform:scale(1.3) rotate(-6deg)}76%{transform:scale(1.12) rotate(3deg)}100%{transform:scale(1)}}',
     '#menuScreen .score-mode-tip{margin:4px 0 0;color:#ddf0ff;font-size:.78rem;text-align:center}',
     '@media(max-width:520px){#menuScreen .score-mode-options{gap:7px}#menuScreen .score-mode-options button{font-size:.84rem;min-height:61px;padding:6px 4px}#threeLivesHud .demo-heart{width:38px;height:38px}}',
     '@media(prefers-reduced-motion:reduce){#threeLivesHud .demo-heart.breaking{animation:none}#threeLivesHud .demo-heart .left-half,#threeLivesHud .demo-heart .right-half{transition:none}}',
     '</style>'
   ].join('\n');
   game=swap(game,'</head>',visualCss+'</head>','styles');

   game=swap(game,'<h3 class="mode-title">Mort subite</h3>','<h3 class="mode-title">🏆 Défis de score</h3>','titre de la carte');
   game=swap(game,
     '<p class="mode-description">Deux additions à la fois. La première réponse fausse arrête immédiatement la partie.</p>',
     '<p class="mode-description">Deux additions à la fois. Fais le plus de calculs justes possible !</p>',
     'description de la carte');
   game=swap(game,
     '<button class="btn btn-gold" id="startSudden" type="button">Lancer la mort subite</button>',
     '<div class="score-mode-options"><button id="startThreeLives" type="button">❤️❤️❤️ <span>3 vies</span><small>50 % des XP · sans trophée</small></button><button class="btn btn-gold" id="startSudden" type="button">💀 <span>Mort subite</span><small>+20 % de points · 100 % XP</small></button></div><p class="score-mode-tip">Les bonus affichés sont proposés, pas encore crédités dans cet essai.</p>',
     'boutons Défis de score');
   game=swap(game,
     '<div class="session-pill" id="sessionScore">Score : 0 / 10</div>',
     '<div class="session-pill" id="sessionScore">Score : 0 / 10</div><div id="threeLivesHud" hidden aria-label="Trois vies au départ"></div>',
     'emplacement des trois cœurs');

   // La session trois vies ne partage aucun record, bonus XP ou trophée avec la Mort subite.
   const helpers=[
     '  function demoHeartHtml(){',
     '    const whole=\'<svg class="whole" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 42 C16 35 4 26 4 16 C4 9 9 5 15 5 C19 5 22 7 24 11 C26 7 29 5 33 5 C39 5 44 9 44 16 C44 26 32 35 24 42Z" fill="#ee4b63" stroke="#ad2b40" stroke-width="1.3"/><path d="M11 13 Q14 9 18 12" stroke="#ffb8c2" stroke-width="2.6" fill="none" stroke-linecap="round"/></svg>\';',
     '    const broken=\'<svg class="broken" viewBox="0 0 48 48" aria-hidden="true"><path class="left-half" d="M21 11 C12 2 4 8 4 16 C4 26 14 35 20 40 L23 29 L19 24 L25 17Z" fill="#303540" stroke="#20252e" stroke-width="1.4"/><path class="right-half" d="M27 9 C37 2 44 9 44 16 C44 26 34 35 28 41 L25 29 L29 23 L24 18Z" fill="#303540" stroke="#20252e" stroke-width="1.4"/></svg>\';',
     '    return \'<span class="demo-heart" aria-hidden="true">\'+whole+broken+\'</span>\';',
     '  }',
     '  function syncDemoHearts(){',
     '    const hud=document.getElementById("threeLivesHud");',
     '    if(!hud)return;',
     '    hud.hidden=session.mode!=="three-lives";',
     '    if(!hud.hidden){hud.innerHTML=demoHeartHtml().repeat(3);hud.setAttribute("aria-label","3 vies restantes")}',
     '  }',
     '  function loseDemoHeart(){',
     '    session.hearts--;',
     '    const hud=document.getElementById("threeLivesHud");',
     '    const heart=hud?.children[session.hearts];',
     '    if(heart){heart.classList.add("breaking");setTimeout(()=>heart.classList.add("lost"),470)}',
     '    if(hud)hud.setAttribute("aria-label",String(session.hearts)+" vies restantes");',
     '  }',
     '  function endThreeLives(){',
     '    phase="ended";setNumpadDisabled(true);resetBtn.disabled=true;',
     '    setPrimaryLabel("Retour au menu");updateBar();',
     '    setFeedback("Les trois vies sont perdues. Fin de partie ! Score : "+session.score+".","bad");',
     '  }',
     ''
   ].join('\n');
   game=swap(game,'  function startSession(mode){',helpers+'  function startSession(mode){','aides trois vies');
   game=swap(game,
     "mode==='sudden'?+suddenMaxDigits.value:+trainingMaxDigits.value",
     "(mode==='sudden'||mode==='three-lives')?+suddenMaxDigits.value:+trainingMaxDigits.value",
     'niveau du nouveau mode');
   game=swap(game,
     "score:0,completed:0,rulerUsed:false};",
     "score:0,completed:0,rulerUsed:false,hearts:mode==='three-lives'?3:null};",
     'initialisation vies');
   game=swap(game,
     "menuScreen.classList.add('hidden');gameScreen.classList.remove('hidden');makePair()",
     "menuScreen.classList.add('hidden');gameScreen.classList.remove('hidden');syncDemoHearts();makePair()",
     'apparition des cœurs');

   // Un calcul faux est immédiatement abandonné ; jamais de correction ni double pénalité.
   const threeLivesBranch=[
     "    if(session.mode==='three-lives'){",
     "      let right=0,lost=0;",
     "      for(const i of candidates){",
     "        if(evals[i].correct){",
     "          lockCalc(i);status(i,'Correct','ok');session.score++;session.completed++;right++;",
     "        }else{",
     "          states[i].solved=true;states[i].firstTry=false;session.completed++;lost++;",
     "          opFor(i).querySelectorAll('input').forEach(input=>input.disabled=true);",
     "          status(i,'Calcul raté · une vie perdue','bad');loseDemoHeart();",
     "          if(session.hearts===0){endThreeLives();return}",
     "        }",
     "      }",
     "      updateBar();",
     "      if(states.every(s=>s.solved)){",
     "        phase='review';setNumpadDisabled(true);resetBtn.disabled=true;",
     "        setPrimaryLabel('Passer aux 2 calculs suivants');",
     "        setFeedback(lost?'Calcul raté : '+session.hearts+' vie(s) restante(s).':'Bien joué : +'+right+' point(s).','info');",
     "      }else{",
     "        setFeedback(lost?'Une vie perdue : passe au calcul suivant.':'Calcul vérifié, continue.','info');",
     "        focusTarget(firstUnsolvedTarget());",
     "      }",
     "      return;",
     "    }",
     ""
   ].join('\n');
   game=swap(game,
     "    if(session.mode==='sudden'){\n      let newly=0;",
     threeLivesBranch+"    if(session.mode==='sudden'){\n      let newly=0;",
     'logique de validation trois vies');
   game=swap(game,
     ":'La première erreur termine la partie.';",
     ":(session.mode==='three-lives'?'Un calcul faux coûte un cœur et ne se corrige pas. La partie finit après trois erreurs.':'La première erreur termine la partie.');",
     'instructions trois vies');
   game=swap(game,
     "    }else if(session.mode==='sudden'){\n      sessionModeEl.textContent='💀 Mort subite';",
     "    }else if(session.mode==='three-lives'){\n      sessionModeEl.textContent='❤️ 3 vies';sessionProgressEl.textContent=String(session.completed+1)+'–'+String(session.completed+2);\n      sessionScoreEl.textContent='Score : '+session.score;scoreRulerBtn.classList.remove('hidden');updateScoreRuler();\n    }else if(session.mode==='sudden'){\n      sessionModeEl.textContent='💀 Mort subite';",
     'barre de score');
   game=swap(game,
     "startSudden.addEventListener('click',()=>startSession('sudden'));",
     "startSudden.addEventListener('click',()=>startSession('sudden'));$('startThreeLives').addEventListener('click',()=>startSession('three-lives'));",
     'lancement trois vies');
   // Ouvrir Mort subite en démo, indépendamment des déblocages du vrai profil.
   game=swap(game,
     "    const locked=!suddenUnlocked(level,p);",
     "    const locked=false; // Essai isolé : déblocages réels inchangés.",
     'déblocage local de l’essai');
   frame.srcdoc=game;
   status.remove();
 }catch(error){
   frame.hidden=true;
   status.textContent='Impossible de préparer l’essai : '+error.message+'. Le vrai jeu Addition simple reste inchangé.';
 }
})();
</script>
</body>
</html>
