name: Addition simple — guidé collectif candidat
on:
  pull_request:
    paths:
      - 'docs/guided-classroom-progress.md'
      - 'collective-*.mjs'
      - 'collective-native-bridge.js'
      - 'index.html'
      - 'tests/guided-classroom-*.test.mjs'
      - '.github/workflows/guided-classroom.yml'
permissions:
  contents: read
jobs:
  guided-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Contrat, sauvegarde et syntaxe de l'intégration
        run: node --test tests/collective-contract.test.mjs tests/guided-classroom-static.test.mjs tests/guided-draft-security.test.mjs
